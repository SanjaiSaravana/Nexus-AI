<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)" />

  <!-- Navigation / Header -->
  <rect x="0" y="0" width="1200" height="60" fill="#0f172a" opacity="0.9" />
  <circle cx="40" cy="30" r="14" fill="#6366f1" />
  <text x="65" y="36" fill="#f8fafc" font-family="Inter, sans-serif" font-weight="700" font-size="18">NEXUS AI</text>
  <text x="170" y="36" fill="#94a3b8" font-family="Inter, sans-serif" font-size="14">Cognitive Memory Manager</text>

  <!-- Filter Pills & Search -->
  <rect x="50" y="80" width="100" height="34" rx="17" fill="#6366f1" />
  <text x="75" y="102" fill="#ffffff" font-family="Inter, sans-serif" font-size="13" font-weight="600">All (24)</text>
  <rect x="160" y="80" width="140" height="34" rx="17" fill="#1e293b" stroke="#334155" />
  <text x="180" y="102" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13">💡 Semantic (11)</text>
  <rect x="310" y="80" width="130" height="34" rx="17" fill="#1e293b" stroke="#334155" />
  <text x="330" y="102" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13">📅 Episodic (6)</text>
  <rect x="450" y="80" width="140" height="34" rx="17" fill="#1e293b" stroke="#334155" />
  <text x="470" y="102" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13">⚙️ Procedural (4)</text>
  <rect x="600" y="80" width="130" height="34" rx="17" fill="#1e293b" stroke="#334155" />
  <text x="620" y="102" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13">🧠 Working (3)</text>

  <!-- Search Input -->
  <rect x="850" y="80" width="300" height="34" rx="17" fill="#1e293b" stroke="#334155" />
  <text x="875" y="102" fill="#64748b" font-family="Inter, sans-serif" font-size="12">Search memories...</text>

  <!-- Memory Card 1: Semantic -->
  <rect x="50" y="140" width="530" height="150" rx="12" fill="#0f172a" stroke="#334155" />
  <rect x="70" y="160" width="100" height="24" rx="12" fill="#0284c7" fill-opacity="0.2" />
  <text x="85" y="176" fill="#38bdf8" font-family="Inter, sans-serif" font-size="11" font-weight="700">SEMANTIC</text>
  <text x="510" y="176" fill="#22c55e" font-family="Inter, sans-serif" font-size="12" font-weight="600">92% Imp</text>
  <text x="70" y="210" fill="#f1f5f9" font-family="Inter, sans-serif" font-size="14" font-weight="500">"User is a Principal Cloud Architect specializing in AWS, Kubernetes, and distributed streaming systems."</text>
  <text x="70" y="260" fill="#64748b" font-family="Inter, sans-serif" font-size="11">Accessed 14 times • Deduplicated &amp; reinforced 2 hrs ago</text>

  <!-- Memory Card 2: Episodic -->
  <rect x="620" y="140" width="530" height="150" rx="12" fill="#0f172a" stroke="#334155" />
  <rect x="640" y="160" width="90" height="24" rx="12" fill="#a855f7" fill-opacity="0.2" />
  <text x="655" y="176" fill="#c084fc" font-family="Inter, sans-serif" font-size="11" font-weight="700">EPISODIC</text>
  <text x="1080" y="176" fill="#22c55e" font-family="Inter, sans-serif" font-size="12" font-weight="600">88% Imp</text>
  <text x="640" y="210" fill="#f1f5f9" font-family="Inter, sans-serif" font-size="14" font-weight="500">"User prepared for Stripe Senior Cloud Architect interview, focusing on high-concurrency SQL and system scaling."</text>
  <text x="640" y="260" fill="#64748b" font-family="Inter, sans-serif" font-size="11">Created via Flagship Workflow • Source: conversation</text>

  <!-- Memory Card 3: Procedural -->
  <rect x="50" y="320" width="530" height="150" rx="12" fill="#0f172a" stroke="#334155" />
  <rect x="70" y="340" width="110" height="24" rx="12" fill="#10b981" fill-opacity="0.2" />
  <text x="85" y="356" fill="#34d399" font-family="Inter, sans-serif" font-size="11" font-weight="700">PROCEDURAL</text>
  <text x="510" y="356" fill="#22c55e" font-family="Inter, sans-serif" font-size="12" font-weight="600">85% Imp</text>
  <text x="70" y="390" fill="#f1f5f9" font-family="Inter, sans-serif" font-size="14" font-weight="500">"User prefers concise code responses with strict TypeScript types, modern Python 3.11 type hints, and dark mode."</text>
  <text x="70" y="440" fill="#64748b" font-family="Inter, sans-serif" font-size="11">Guides AI response style • High priority formatting</text>

  <!-- Memory Card 4: Working -->
  <rect x="620" y="320" width="530" height="150" rx="12" fill="#0f172a" stroke="#334155" />
  <rect x="640" y="340" width="90" height="24" rx="12" fill="#f59e0b" fill-opacity="0.2" />
  <text x="655" y="356" fill="#fbbf24" font-family="Inter, sans-serif" font-size="11" font-weight="700">WORKING</text>
  <text x="1080" y="356" fill="#eab308" font-family="Inter, sans-serif" font-size="12" font-weight="600">75% Imp</text>
  <text x="640" y="390" fill="#f1f5f9" font-family="Inter, sans-serif" font-size="14" font-weight="500">"User is actively rehearsing mock interview scenarios and preparing system design STAR narrative responses."</text>
  <text x="640" y="440" fill="#64748b" font-family="Inter, sans-serif" font-size="11">Active session state • Expires upon milestone completion</text>
</svg>
