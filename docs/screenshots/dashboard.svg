<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f293d" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)" />

  <!-- Navigation / Header -->
  <rect x="0" y="0" width="1200" height="60" fill="#0f172a" opacity="0.9" />
  <circle cx="40" cy="30" r="14" fill="url(#accent)" />
  <text x="65" y="36" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="18">NEXUS AI</text>
  <text x="170" y="36" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="14">Executive Dashboard</text>

  <!-- Status pill -->
  <rect x="1050" y="18" width="110" height="26" rx="13" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-width="1" />
  <circle cx="1065" cy="31" r="4" fill="#22c55e" />
  <text x="1077" y="35" fill="#22c55e" font-family="Inter, sans-serif" font-size="12" font-weight="600">All Systems OK</text>

  <!-- Metric Card 1 -->
  <rect x="50" y="90" width="250" height="110" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1" />
  <text x="70" y="125" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13">Active Projects</text>
  <text x="70" y="165" fill="#ffffff" font-family="Inter, sans-serif" font-size="32" font-weight="700">12</text>
  <text x="210" y="165" fill="#22c55e" font-family="Inter, sans-serif" font-size="12">+3 this mo</text>

  <!-- Metric Card 2 -->
  <rect x="330" y="90" width="250" height="110" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1" />
  <text x="350" y="125" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13">Task Completion</text>
  <text x="350" y="165" fill="#ffffff" font-family="Inter, sans-serif" font-size="32" font-weight="700">84%</text>
  <text x="490" y="165" fill="#38bdf8" font-family="Inter, sans-serif" font-size="12">42 / 50 tasks</text>

  <!-- Metric Card 3 -->
  <rect x="610" y="90" width="250" height="110" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1" />
  <text x="630" y="125" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13">Upcoming Deadlines</text>
  <text x="630" y="165" fill="#f59e0b" font-family="Inter, sans-serif" font-size="32" font-weight="700">4</text>
  <text x="770" y="165" fill="#f59e0b" font-family="Inter, sans-serif" font-size="12">Next 48 hrs</text>

  <!-- Metric Card 4 -->
  <rect x="890" y="90" width="260" height="110" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1" />
  <text x="910" y="125" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13">Proactive Recommendations</text>
  <text x="910" y="165" fill="#ec4899" font-family="Inter, sans-serif" font-size="32" font-weight="700">3</text>
  <text x="1040" y="165" fill="#ec4899" font-family="Inter, sans-serif" font-size="12">Requires review</text>

  <!-- Proactive Alert Banner -->
  <rect x="50" y="230" width="1100" height="130" rx="12" fill="#1e1b4b" fill-opacity="0.6" stroke="#6366f1" stroke-width="1.5" />
  <circle cx="85" cy="270" r="16" fill="#6366f1" />
  <text x="80" y="276" fill="#ffffff" font-family="Inter, sans-serif" font-size="16" font-weight="bold">!</text>
  <text x="115" y="265" fill="#e0e7ff" font-family="Inter, sans-serif" font-size="16" font-weight="600">Proactive Intelligence: Upcoming Interview Prep Gap Detected</text>
  <text x="115" y="295" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13">Interview for "Senior Cloud Architect" is tomorrow at 2:00 PM. No preparation tasks currently exist, but target job description is in Knowledge Vault.</text>
  <!-- Buttons -->
  <rect x="115" y="315" width="180" height="30" rx="6" fill="#6366f1" />
  <text x="135" y="335" fill="#ffffff" font-family="Inter, sans-serif" font-size="12" font-weight="600">Generate Prep Plan</text>
  <rect x="310" y="315" width="100" height="30" rx="6" fill="transparent" stroke="#64748b" stroke-width="1" />
  <text x="340" y="335" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12">Dismiss</text>

  <!-- Left Column: Tasks / Deadlines -->
  <rect x="50" y="380" width="530" height="280" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1" />
  <text x="75" y="415" fill="#ffffff" font-family="Inter, sans-serif" font-size="16" font-weight="600">Upcoming Deadlines &amp; Tasks</text>
  <!-- Task 1 -->
  <rect x="75" y="440" width="480" height="45" rx="8" fill="#1e293b" />
  <circle cx="95" cy="462" r="5" fill="#ef4444" />
  <text x="115" y="467" fill="#f1f5f9" font-family="Inter, sans-serif" font-size="13">Review System Design &amp; Microservices</text>
  <text x="480" y="467" fill="#f87171" font-family="Inter, sans-serif" font-size="11">Tomorrow</text>
  <!-- Task 2 -->
  <rect x="75" y="495" width="480" height="45" rx="8" fill="#1e293b" />
  <circle cx="95" cy="517" r="5" fill="#f59e0b" />
  <text x="115" y="522" fill="#f1f5f9" font-family="Inter, sans-serif" font-size="13">Rehearse STAR Behavioral Narratives</text>
  <text x="480" y="522" fill="#fbbf24" font-family="Inter, sans-serif" font-size="11">Tomorrow</text>
  <!-- Task 3 -->
  <rect x="75" y="550" width="480" height="45" rx="8" fill="#1e293b" />
  <circle cx="95" cy="572" r="5" fill="#22c55e" />
  <text x="115" y="577" fill="#f1f5f9" font-family="Inter, sans-serif" font-size="13">Database Migration Runbook</text>
  <text x="500" y="577" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">Oct 28</text>

  <!-- Right Column: Goals -->
  <rect x="620" y="380" width="530" height="280" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1" />
  <text x="645" y="415" fill="#ffffff" font-family="Inter, sans-serif" font-size="16" font-weight="600">Strategic Goals Progress</text>
  <!-- Goal 1 -->
  <text x="645" y="455" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="13">Lead Principal Architect Transition</text>
  <text x="1090" y="455" fill="#a855f7" font-family="Inter, sans-serif" font-size="12">85%</text>
  <rect x="645" y="468" width="480" height="8" rx="4" fill="#334155" />
  <rect x="645" y="468" width="408" height="8" rx="4" fill="url(#accent)" />
  <!-- Goal 2 -->
  <text x="645" y="520" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="13">Deploy Multi-Agent Autonomous Pipeline</text>
  <text x="1090" y="520" fill="#38bdf8" font-family="Inter, sans-serif" font-size="12">100%</text>
  <rect x="645" y="533" width="480" height="8" rx="4" fill="#334155" />
  <rect x="645" y="533" width="480" height="8" rx="4" fill="#38bdf8" />
  <!-- Goal 3 -->
  <text x="645" y="585" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="13">Complete Neo4j Knowledge Graph Mesh</text>
  <text x="1090" y="585" fill="#22c55e" font-family="Inter, sans-serif" font-size="12">95%</text>
  <rect x="645" y="598" width="480" height="8" rx="4" fill="#334155" />
  <rect x="645" y="598" width="456" height="8" rx="4" fill="#22c55e" />
</svg>
