  <rect x="965" y="550" width="15" height="22" rx="4" fill="#06b6d4" />
  <text x="990" y="566" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">12ms</text>

  <!-- Audit trail badge -->
  <rect x="75" y="605" width="980" height="35" rx="6" fill="#1e293b" />
  <text x="95" y="628" fill="#22c55e" font-family="Inter, sans-serif" font-size="12">✔ MLflow Run Logged: experiment_id=eval_suite_v1 | zero hallucinations verified</text>
