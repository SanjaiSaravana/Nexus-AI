  <rect x="760" y="460" width="45" height="22" rx="4" fill="#f59e0b" />
  <text x="815" y="476" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">28ms</text>

  <!-- Span 6: LLM Token Streaming -->
  <text x="95" y="520" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13">6. LLM Context Synthesis (Grounded Prompt)</text>
  <rect x="805" y="505" width="160" height="22" rx="4" fill="#10b981" />
  <text x="975" y="521" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">260ms</text>

  <!-- Span 7: Response Formatting -->
