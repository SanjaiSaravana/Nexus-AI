  <text x="75" y="245" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12">Trace ID: 7a8c9b20-e54f-4a11-89be-02948756c9a0 (Duration: 620ms | Total Tokens: 842)</text>

  <!-- Span 1: User Request -->
